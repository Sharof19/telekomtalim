name: uztelecom
description: Uztelecom learning platform mobile app.
publish_to: "none"
version: 1.0.4+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  url_launcher: ^6.2.6
  video_player: ^2.9.2
  webview_flutter: ^4.10.0
  iconsax: ^0.0.8
  connectivity_plus: ^6.1.2
  sms_autofill: ^2.4.1
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Bundled with the app: keep this to public config only, never secrets.
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/lmslogo_app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_foreground: "assets/images/lmslogo_app_icon_foreground.png"
  adaptive_icon_background: "#FFFFFF"
